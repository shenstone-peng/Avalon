  <style>
    body {
      font-family: 'Noto Serif TC', serif;
      background-color: #0f172a; /* slate-900 */
      color: #e2e8f0; /* slate-200 */
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }

    ::-webkit-scrollbar-track {
      background: #1e293b;
    }

      border-radius: 3px;
    }
